use_default_settings:
  engines:
    keep_only:
      - google
      - duckduckgo
      - brave
      - bing
      - wikipedia
      - reddit
      - github
      - stackoverflow
      - google news
      - bing news
      - google images
      - bing images
      - duckduckgo images
      - openstreetmap
      - apple maps
      - photon
      - qwant
      - startpage
      - mojeek
      - wikidata
      - wiktionary
      - youtube
      - vimeo
      - google scholar
      - arxiv
      - google videos
      - bing videos
      - duckduckgo videos
      - gitlab
      - pypi
      - npm
      - docker hub
      - archlinux
      - mdn
general:
  debug: false
  instance_name: "OSRS SearXNG"
  contact_url: false
  enable_metrics: false
search:
  safe_search: 0
  autocomplete: "google"
  autocomplete_min: 2
  default_lang: "auto"
  max_page: 0
  formats:
    - html
    - json
server:
  secret_key: "osrs-searxng-secret-key-change-in-production"
  limiter: false
  image_proxy: true
  http_protocol_version: "1.1"
  method: "GET"
  bind_address: "0.0.0.0"
  port: 8080
ui:
  static_use_hash: true
  default_locale: "fr"
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  default_theme: simple
  theme_args:
    simple_style: auto
plugins:
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
