use_default_settings:
  engines:
    keep_only:
      # Recherche générale
      - google
      - duckduckgo
      - brave
      - bing
      - qwant
      - startpage
      - mojeek
      # Actualités
      - google news
      - bing news
      # Savoir / références
      - wikipedia
      - wikidata
      - wiktionary
      - google scholar
      - arxiv
      # Images
      - google images
      - bing images
      - duckduckgo images
      # Vidéos
      - youtube
      - vimeo
      - google videos
      - bing videos
      - duckduckgo videos
      # Cartes
      - openstreetmap
      - apple maps
      - photon
      # Applications
      - google play apps
      # Développement / IT
      - github
      - gitlab
      - stackoverflow
      - pypi
      - npm
      - docker hub
      - archlinux
      - mdn
      # Social
      - reddit

general:
  debug: false
  instance_name: "OSRS SearXNG"
  contact_url: false
  enable_metrics: false

search:
  safe_search: 2
  autocomplete: "google"
  autocomplete_min: 2
  default_lang: "auto"
  max_page: 0
  formats:
    - html
    - json

server:
  # URL publique en HTTPS (remplace par ton domaine)
  base_url: "https://brasseurmisset08.duckdns.org/"
  secret_key: "df8f56769a667c1dab6fa74b0381ea736d31a65046fc4d8923310108a72e52c7"
  limiter: false
  image_proxy: true
  http_protocol_version: "1.1"
  method: "GET"
  bind_address: "0.0.0.0"
  port: 8080

ui:
  static_use_hash: true
  default_locale: "fr"
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  default_theme: simple
  theme_args:
    simple_style: auto

preferences:
  lock:
    - safesearch

plugins:
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true

